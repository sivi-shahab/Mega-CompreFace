# Prometheus — stack CompreFace (docker-compose.monitoring.yml). Target memakai nama service compose.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: compreface

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      # Label pendek "service" dari label compose (compreface-api, compreface-core, ...)
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      # Simpan hanya container milik compose (buang cgroup sistem)
      - source_labels: [container_label_com_docker_compose_project]
        regex: ""
        action: drop

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: gpu
    static_configs:
      - targets: [gpu-exporter:9835]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]

  # Health endpoint aplikasi. Label "module" memilih aturan validasi di blackbox.yml
  - job_name: health
    metrics_path: /probe
    static_configs:
      - targets: [http://compreface-fe:8080/]
        labels: {service: compreface-fe, module: http_2xx}
      - targets: [http://compreface-admin:8081/actuator/health]
        labels: {service: compreface-admin, module: spring_health}
      - targets: [http://compreface-api:8081/actuator/health]
        labels: {service: compreface-api, module: spring_health}
      - targets: [http://compreface-core:3000/healthcheck]
        labels: {service: compreface-core, module: core_health}
      - targets: [compreface-postgres-db:5432]
        labels: {service: compreface-postgres-db, module: tcp_connect}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
