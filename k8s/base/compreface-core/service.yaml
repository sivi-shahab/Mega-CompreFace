# Diakses api/admin via PYTHON_URL=http://compreface-core:3000 (ClusterIP, tidak diekspos keluar).
apiVersion: v1
kind: Service
metadata:
  name: compreface-core
  labels:
    app.kubernetes.io/name: compreface-core
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: compreface-core
  ports:
    - name: http
      port: 3000
      targetPort: http
