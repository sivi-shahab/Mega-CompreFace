# api menyimpan cache embedding di heap (puluhan ribu embedding di produksi) → memori lebih besar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compreface-api
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 6Gi
