# CONTOH HPA core (OPSIONAL — tidak aktif secara default, lihat kustomization.yaml).
# - Core stateless sehingga aman di-scale horizontal.
# - Varian GPU: tiap replica butuh 1 GPU → maxReplicas ≤ jumlah GPU yang bisa dijadwalkan,
#   selebihnya pod akan Pending. Metrik CPU hanya proxy kasar untuk beban GPU; untuk scaling
#   berbasis utilisasi GPU dibutuhkan DCGM exporter + Prometheus Adapter (di luar scope).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: compreface-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: compreface-core
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # core butuh waktu load model → jangan scale up terlalu agresif
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
    scaleDown:
      stabilizationWindowSeconds: 600
