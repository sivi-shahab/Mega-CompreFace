; uWSGI compreface-core (menggantikan embedding-calculator/uwsgi.ini di image).
; Perbedaan dari upstream:
;  - tanpa uid/gid: container sudah berjalan non-root (USER 33), tidak perlu setuid dari root
;  - port dari env ML_PORT (upstream hardcoded 3000)
; Jumlah worker diatur lewat env yang dibaca otomatis oleh uWSGI:
;   UWSGI_PROCESSES, UWSGI_THREADS, UWSGI_MAX_WORKER_LIFETIME (opsional)
[uwsgi]
chdir = /app/ml
module = src.app:wsgi_app()
master = true
http-socket = 0.0.0.0:$(ML_PORT)
vacuum = true
die-on-term = true
need-app = true
; request log dimatikan (sama dengan upstream) — mengurangi jejak data pribadi di log
disable-logging = true
