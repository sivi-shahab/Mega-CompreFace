# nginx.conf utama compreface-fe (non-root, nginx-unprivileged).
# Diturunkan dari ui/nginx/nginx.conf upstream, disesuaikan agar jalan sebagai uid 101:
# pid & temp path di /tmp, tanpa direktif "user".

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {
  worker_connections 8000;
  multi_accept on;
  use epoll;
}

http {
  proxy_temp_path       /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Hide nginx version information.
  server_tokens off;

  log_format json_combined escape=json
    '{'
      '"time_iso8601":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"request_method":"$request_method",'
      '"uri":"$uri",'
      '"status":"$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"http_user_agent":"$http_user_agent",'
      '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';
  # $uri (bukan $request) dipakai agar query string tidak ikut tercatat di log.
  access_log /var/log/nginx/access.log json_combined;

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_http_version 1.0;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/rss+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    image/svg+xml
    image/x-icon
    text/css
    text/plain
    text/x-component;

  include /etc/nginx/conf.d/*.conf;
}
